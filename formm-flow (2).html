<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formm — Full Flow</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#EFEBE3;--panel:#FFF;--ink:#141310;--ink2:#6B675E;--ink3:#A8A399;--line:rgba(20,19,16,0.07);--green:#17A66E;--green-ink:#0E8A5A;--green-soft:#DCF3E8;--teal:#12C7AE;--amber:#E8912B;--blue:#3E8ED6;--sand:#E5DFD3;--sans:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DED8CD;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px 50px}
.hd{text-align:center;margin-bottom:12px}.hd h1{font-size:19px;font-weight:800}.hd h1 span{color:var(--green-ink)}.hd p{font-size:12px;color:#5f5b53;margin-top:3px;max-width:600px}
.tag{display:inline-block;font-size:10px;font-weight:700;color:#8a5a14;background:#FCE9D6;border-radius:20px;padding:4px 11px;margin-top:8px}
.device{width:392px;max-width:100%;height:812px;background:#000;border:9px solid #0b0b0b;border-radius:48px;overflow:hidden;position:relative;box-shadow:0 36px 84px -26px rgba(0,0,0,0.5)}
.vp{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}.scr.active{display:flex}
.scroll{flex:1;overflow-y:auto}.scroll::-webkit-scrollbar{width:0}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 2px;font-size:11px;font-weight:600;color:var(--ink2);flex-shrink:0}
.pad{padding:10px 20px 16px}
.logo{width:56px;height:56px;flex-shrink:0}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.h1{font-size:28px;font-weight:800;letter-spacing:-0.035em;line-height:1.08}
.sub{font-size:14px;color:var(--ink2);line-height:1.5}
.row{display:flex;align-items:center;gap:11px}.between{display:flex;align-items:center;justify-content:space-between}
.grow{flex:1}
.btn{background:var(--green);color:#fff;font-weight:800;font-size:17px;text-align:center;padding:18px;border-radius:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 24px -10px rgba(23,166,110,0.5)}
.btn.g{background:transparent;border:1.5px solid var(--green);color:var(--green-ink);box-shadow:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.tap{cursor:pointer;transition:transform .1s}.tap:active{transform:scale(0.985)}
.nav{display:flex;align-items:center;gap:12px;padding:12px 16px}
.icb{width:42px;height:42px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.navttl{font-size:18px;font-weight:800}
.i{stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none}
/* ===== landing ===== */
.landing-ex{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lex{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;aspect-ratio:1;border:1px solid var(--line)}
.lex .ph{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#2a2a2a}
.lex .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.05),rgba(7,50,42,0.82))}
.lex .nm{position:absolute;left:12px;bottom:11px;z-index:2;color:#fff;font-weight:800;font-size:15px;line-height:1.1}
.lex .eq{position:absolute;left:12px;top:11px;z-index:2;font-size:9px;font-weight:700;color:#fff;background:rgba(255,255,255,0.22);backdrop-filter:blur(4px);padding:3px 8px;border-radius:20px}
/* ===== signup ===== */
.field{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.field .fl{font-size:15px;font-weight:700}.field .fv{font-size:14px;color:var(--ink3)}
.howrow{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.howrow:last-child{border-bottom:none}
.hownum{width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.howt{font-size:15px;font-weight:700}.howd{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
/* ===== home ===== */
.hi{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-top:2px}
.statchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 13px;font-size:13px;font-weight:800}.statchip small{font-size:9px;font-weight:700;color:var(--ink3)}
.watermini{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 13px;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;height:104px;border:1px solid var(--line)}
.tile .ph{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#1a1a1a}
.tile .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.1) 45%,rgba(0,0,0,0.82))}
.tile .cap{position:absolute;bottom:0;left:0;right:0;padding:10px 11px;z-index:2;color:#fff}
.tile .cn{font-size:12.5px;font-weight:800}.tile .cs{font-size:10px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block}
.sec-eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.vpill{font-size:11px;font-weight:700;color:var(--green-ink);border:1.5px solid var(--green);border-radius:20px;padding:5px 12px;cursor:pointer}
.recrow{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.recrow:last-child{border-bottom:none}
.recthumb{width:38px;height:38px;border-radius:10px;background-size:cover;background-position:center;background-color:#333;flex-shrink:0}
.recscore{font-size:19px;font-weight:800;color:var(--green-ink)}
.read{border-radius:16px;overflow:hidden;position:relative;height:84px;margin-top:8px}
.read .ph{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#333}
.read .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,40,34,0.92),rgba(6,40,34,0.35))}
.read .txt{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);z-index:2;color:#fff}
.read .big{font-size:13px;font-weight:700;line-height:1.3}
.mbscard{border-radius:16px;overflow:hidden;position:relative;height:96px;cursor:pointer;margin-top:8px}
.mbscard .ph{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#2a3a33}
.mbscard .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,50,42,0.9),rgba(7,50,42,0.4))}
.mbscard .txt{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:2;color:#fff}
.foot{display:flex;align-items:flex-end;background:rgba(255,255,255,0.97);border-top:1px solid var(--line);flex-shrink:0;padding:0 4px}
.foot .t{flex:1;text-align:center;padding:8px 0 11px;font-size:10px;color:var(--ink3);font-weight:600;cursor:pointer}.foot .t.on{color:var(--green-ink)}
.foot .fi{display:block;margin:0 auto 3px}
.foot .live-c{width:52px;height:52px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:-14px auto 1px;box-shadow:0 8px 18px -5px rgba(23,166,110,0.5)}
/* ===== simplified instruction ===== */
.instr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 28px}
.instr-icon{width:120px;height:120px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.instr-big{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.15}
.instr-sub{font-size:15px;color:var(--ink2);margin-top:12px;line-height:1.5;max-width:280px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:28px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--sand)}.dots span.on{background:var(--green);width:22px;border-radius:20px}
/* camera */
.cam{flex:1;background:radial-gradient(circle at 50% 42%,#1a2420,#0d1512);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.frameguide{position:absolute;inset:50px 34px 150px;border:2px solid var(--green);border-radius:22px;opacity:.6}
.cam-status{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(23,166,110,0.9);color:#fff;font-size:12px;font-weight:700;padding:7px 15px;border-radius:20px}
.rec{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,0.35);cursor:pointer}
.score-hero{text-align:center}
.score-num{font-size:96px;font-weight:900;letter-spacing:-0.05em;line-height:0.85;color:var(--green-ink)}
</style></head>
<body>
<div class="hd"><h1>Formm — <span>Full Flow (from scratch)</span></h1>
<p>Landing (try a scan, no sign-in) → Sign-up → Home → Simplified instructions → Scan. Landing exercises are equipment-free.</p>
<div class="tag">CONCEPT — clickable · start at Landing</div></div>

<div class="device"><div class="vp" id="vp"></div></div>

<script>
const LOGO='<svg viewBox="0 0 100 100" style="width:100%;height:100%"><circle cx="50" cy="50" r="50" fill="#0b0b0b"/><circle cx="50" cy="50" r="41" fill="none" stroke="#12C7AE" stroke-width="3.4"/><rect x="38.5" y="24" width="6.2" height="42" rx="3.1" fill="#fff"/><circle cx="51.5" cy="27" r="3.1" fill="#12C7AE"/><circle cx="60" cy="27" r="3.1" fill="#12C7AE"/><circle cx="68.5" cy="27" r="3.1" fill="#12C7AE"/><path d="M38.5 55 q0 8 8 8" fill="none" stroke="#12C7AE" stroke-width="5.5" stroke-linecap="round"/><circle cx="53" cy="49" r="3" fill="#fff"/><path d="M60 42 l7 7 -7 7" fill="none" stroke="#12C7AE" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const IMG={
 squat:'https://images.unsplash.com/photo-1434608519344-49d77a699e1d?q=75&w=500&auto=format&fit=crop',
 reach:'https://images.unsplash.com/photo-1518611012118-696072aa579a?q=75&w=500&auto=format&fit=crop',
 balance:'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=75&w=500&auto=format&fit=crop',
 lunge:'https://images.unsplash.com/photo-1540496905036-5937c10647cc?q=75&w=500&auto=format&fit=crop',
 age:'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=75&w=400&auto=format&fit=crop',
 acwr:'https://images.unsplash.com/photo-1461897104016-0b3b00cc81ee?q=75&w=400&auto=format&fit=crop',
 read:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=75&w=600&auto=format&fit=crop',
 mbs:'https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=75&w=600&auto=format&fit=crop',
 th:'https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?q=75&w=140&auto=format&fit=crop',
};
const SCR={};let CUR=null,hist=[];
function go(id,push=true){const el=document.getElementById(id);if(!el){T('Coming soon');return;}document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));if(push&&CUR)hist.push(CUR);CUR=id;el.classList.add('active');const s=el.querySelector('.scroll');if(s)s.scrollTop=0;}
function back(){const p=hist.pop();if(p){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));CUR=p;document.getElementById(p).classList.add('active');}else go('landing',false);}
function T(m){let t=document.createElement('div');t.textContent=m;t.style.cssText='position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,19,16,0.9);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99;font-weight:600';document.getElementById('vp').appendChild(t);setTimeout(()=>t.remove(),1400);}
const sbar='<div class="sbar"><span>9:41</span><span>◍ ▚ ▮</span></div>';
const FIRE='<svg width="15" height="15" viewBox="0 0 24 24"><path d="M13 2c.5 3.5-1.5 5-2.5 6.5C9.3 10.2 9 11.4 9 12.5c-1-.5-1.8-1.8-2-3-1.5 1.3-3 3.5-3 6.2A8 8 0 0020 16c0-4.5-3-7-4.5-9C14 5.3 13.3 3.7 13 2z" fill="#E8912B"/></svg>';
const DROP='<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 2.5C12 2.5 5 10 5 15a7 7 0 0014 0c0-5-7-12.5-7-12.5z" fill="#3E8ED6"/></svg>';
const BACK='<svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';

/* ===================== 1. LANDING (try before sign-in) ===================== */
SCR.landing=`${sbar}<div class="scroll" style="display:flex;flex-direction:column"><div class="pad" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:30px">
 <div class="grow"></div>
 <div class="eyebrow" style="color:var(--green-ink);font-size:12px;letter-spacing:.16em">Movement Intelligence</div>
 <div style="font-size:52px;font-weight:800;letter-spacing:-0.04em;margin-top:10px;line-height:1">Formm</div>
 <div style="font-size:19px;color:var(--ink2);margin-top:16px;line-height:1.35;font-weight:500">We track how you move. You understand why it matters.</div>
 <div class="btn" style="margin-top:26px" onclick="go('tryselect')">Try Formm</div>
 <div class="btn" style="margin-top:12px;background:#14191F;box-shadow:none" onclick="go('signin')">Sign in</div>
</div></div>`;

/* the bodyweight scan list that Try Formm leads to */
SCR.tryselect=`${sbar}<div class="nav"><div class="icb" onclick="back()">${BACK}</div><div class="navttl">Try Formm</div></div>
<div class="scroll"><div class="pad">
 <div class="sub" style="margin-bottom:4px">Pick a move you can do right now \u2014 no equipment. We'll scan your form and give you a score.</div>
 <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
   ${[['Bodyweight Squat','squat'],['Overhead Reach','reach'],['Single-leg Balance','balance'],['Lunge','lunge']].map(([n,k])=>`<div class="tap" onclick="go('instr')" style="display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px"><div style="width:46px;height:46px;border-radius:11px;background-image:url(${IMG[k]});background-size:cover;background-position:center;background-color:#2a2a2a;flex-shrink:0"></div><div style="flex:1"><div style="font-size:15px;font-weight:700">${n}</div><div style="font-size:11px;color:var(--ink3);font-weight:600">No equipment</div></div><div style="color:var(--ink3);font-size:20px">\u203a</div></div>`).join('')}
 </div>
 <div style="height:10px"></div>
</div></div>`;

/* ===================== 2. SIGN-UP ===================== */
SCR.signup=`${sbar}<div class="nav"><div class="icb" onclick="back()">${BACK}</div><div class="navttl">Create your account</div></div>
<div class="scroll"><div class="pad">
 <div style="text-align:center;margin-top:6px">
   <div class="logo" style="width:48px;height:48px;margin:0 auto">${LOGO}</div>
   <div class="h1" style="font-size:24px;margin-top:12px">Save your progress</div>
   <div class="sub" style="margin-top:6px">Keep your scores and watch your form improve over time.</div>
 </div>
 <div style="margin-top:22px">
   <div class="field"><span class="fl">Name</span><span class="fv">Your name</span></div>
   <div class="field"><span class="fl">Email</span><span class="fv">you@email.com</span></div>
   <div class="field"><span class="fl">Password</span><span class="fv">Choose a password</span></div>
 </div>
 <div class="btn" style="margin-top:8px" onclick="go('home')">Create Account</div>
 <div style="display:flex;align-items:center;gap:10px;margin:18px 0"><div style="flex:1;height:1px;background:var(--line)"></div><span style="font-size:11px;color:var(--ink3);font-weight:600">OR</span><div style="flex:1;height:1px;background:var(--line)"></div></div>
 <div class="btn g" onclick="go('signin')">Sign In</div>
 <div style="text-align:center;margin-top:16px;font-size:11px;color:var(--ink3);line-height:1.5">By continuing you agree to our<br><b style="color:var(--green-ink)">Terms</b> & <b style="color:var(--green-ink)">Privacy Policy</b></div>
 <div style="height:10px"></div>
</div></div>`;

SCR.signin=`${sbar}<div class="nav"><div class="icb" onclick="back()">${BACK}</div><div class="navttl">Sign In</div></div>
<div class="scroll"><div class="pad">
 <div style="text-align:center;margin-top:6px">
   <div class="logo" style="width:48px;height:48px;margin:0 auto">${LOGO}</div>
   <div class="h1" style="font-size:24px;margin-top:12px">Welcome back</div>
   <div class="sub" style="margin-top:6px">Pick up right where you left off.</div>
 </div>
 <div style="margin-top:22px">
   <div class="field"><span class="fl">Email</span><span class="fv">you@email.com</span></div>
   <div class="field"><span class="fl">Password</span><span class="fv">Your password</span></div>
 </div>
 <div style="text-align:right;margin-top:-2px;margin-bottom:14px"><span class="tap" style="font-size:13px;font-weight:700;color:var(--green-ink)" onclick="go('forgot')">Forgot password?</span></div>
 <div class="btn" onclick="go('home')">Sign In</div>
 <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--ink2)">New to Formm? <b class="tap" style="color:var(--green-ink)" onclick="go('signup')">Create an account</b></div>
 <div style="height:10px"></div>
</div></div>`;

SCR.forgot=`${sbar}<div class="nav"><div class="icb" onclick="back()">${BACK}</div><div class="navttl">Reset password</div></div>
<div class="scroll"><div class="pad">
 <div style="text-align:center;margin-top:10px">
   <div style="width:72px;height:72px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;margin:0 auto"><svg class="i" width="34" height="34" viewBox="0 0 24 24" style="stroke:var(--green-ink)"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/></svg></div>
   <div class="h1" style="font-size:24px;margin-top:16px">Forgot your password?</div>
   <div class="sub" style="margin-top:8px;max-width:290px;margin-inline:auto">Enter your email and we'll send you a link to reset it.</div>
 </div>
 <div class="field" style="margin-top:24px"><span class="fl">Email</span><span class="fv">you@email.com</span></div>
 <div class="btn" style="margin-top:6px" onclick="T('Reset link sent \u2014 check your email')">Send reset link</div>
 <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--ink2)">Remembered it? <b class="tap" style="color:var(--green-ink)" onclick="go('signin')">Back to Sign In</b></div>
</div></div>`;

/* ===================== 3. HOME ===================== */
function foot(a){const ic={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',prog:'<path d="M4 20V10M10 20V4M16 20v-7M20 20H3"/>',prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4 12H2M22 12h-2"/>'};
 return `<div class="foot">
  <div class="t ${a==='home'?'on':''}" onclick="go('home')"><svg class="i fi" width="22" height="22" viewBox="0 0 24 24">${ic.home}</svg>Home</div>
  <div class="t" onclick="go('progress')"><svg class="i fi" width="22" height="22" viewBox="0 0 24 24">${ic.prog}</svg>Progress</div>
  <div class="t" onclick="go('exselect')"><div class="live-c"><svg class="i" width="24" height="24" viewBox="0 0 24 24" style="stroke:#fff"><path d="M3 8a2 2 0 012-2h2l1.5-2h7L18 6h1a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="12.5" r="3.2"/></svg></div><div style="font-size:10px;color:var(--green-ink);font-weight:700">Live</div></div>
  <div class="t" onclick="go('profile')"><svg class="i fi" width="22" height="22" viewBox="0 0 24 24">${ic.prof}</svg>Profile</div>
  <div class="t" onclick="go('settings')"><svg class="i fi" width="22" height="22" viewBox="0 0 24 24">${ic.set}</svg>Settings</div>
 </div>`;}
SCR.home=`${sbar}<div class="scroll"><div class="pad">
 <div class="between" style="margin-top:4px">
   <div class="row"><div class="logo">${LOGO}</div><div><div class="eyebrow">Movement Intelligence</div><div class="hi">Hi, Prince</div></div></div>
   <div class="statchip">${FIRE} 1 <small>DAY</small></div>
 </div>
 <div style="margin-top:12px"><span class="watermini" onclick="go('water')">${DROP} 0 / 3.5 L</span></div>
