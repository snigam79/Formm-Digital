<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formm — Home (HPC)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#EFEBE3;--panel:#FFF;--ink:#141310;--ink2:#6B675E;--ink3:#A8A399;--line:rgba(20,19,16,0.07);--green:#17A66E;--green-ink:#0E8A5A;--teal:#12C7AE;--amber:#E8912B;--blue:#3E8ED6;--red:#D9534F;--sand:#E5DFD3;--dark:#141712;--dark2:#1E2219;--sans:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DED8CD;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px 50px}
.hd{text-align:center;margin-bottom:12px}.hd h1{font-size:19px;font-weight:800}.hd h1 span{color:var(--green-ink)}.hd p{font-size:12px;color:#5f5b53;margin-top:3px;max-width:560px}
.tag{display:inline-block;font-size:10px;font-weight:700;color:#8a5a14;background:#FCE9D6;border-radius:20px;padding:4px 11px;margin-top:8px}
.device{width:392px;max-width:100%;height:812px;background:#000;border:9px solid #0b0b0b;border-radius:48px;overflow:hidden;position:relative;box-shadow:0 36px 84px -26px rgba(0,0,0,0.5)}
.vp{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}.scr.active{display:flex}
.scr.dark{background:var(--dark)}
.scroll{flex:1;overflow-y:auto}.scroll::-webkit-scrollbar{width:0}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 2px;font-size:11px;font-weight:600;color:var(--ink2);flex-shrink:0}
.sbar.lt{color:rgba(255,255,255,0.75)}
.pad{padding:10px 18px 16px}
.logo{width:52px;height:52px;flex-shrink:0}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.hi{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-top:2px}
.row{display:flex;align-items:center;gap:11px}.between{display:flex;align-items:center;justify-content:space-between}
.statchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 13px;font-size:13px;font-weight:800;color:var(--ink)}
.statchip small{font-size:9px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.watermini{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 13px;font-size:12px;font-weight:700;color:var(--blue);cursor:pointer}

/* ===== FIX YOUR FORMM tab (full width, 4 points on the tab) ===== */
.fyftab{position:relative;background:linear-gradient(150deg,#17A66E,#0E8A5A);border-radius:18px;padding:16px 16px 15px;cursor:pointer;overflow:hidden;color:#fff;box-shadow:0 12px 26px -14px rgba(14,138,90,0.6);margin-top:16px}
.fyftab .glow{position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,255,255,0.18),transparent 70%)}
.fyftab .top{display:flex;align-items:center;gap:12px}
.fyftab .ic2{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fyftab .tn{font-size:23px;font-weight:900;letter-spacing:-0.03em;white-space:nowrap}
.fpoints{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin-top:15px}
.fpoint{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:rgba(255,255,255,0.96)}
.fpoint .n{width:21px;height:21px;border-radius:50%;background:rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
/* ===== HPC tab (full width) ===== */
.hpctab{position:relative;background:linear-gradient(150deg,#1E2219,#0f120d);border:1px solid rgba(18,199,174,0.22);border-radius:18px;padding:16px 44px 16px 16px;cursor:pointer;overflow:hidden;color:#fff;margin-top:12px}
.hpctab .glow{position:absolute;left:-30px;bottom:-30px;width:150px;height:150px;background:radial-gradient(circle,rgba(18,199,174,0.18),transparent 70%)}
.hpctab .arr{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--teal)}
.hpctab .hh{font-size:20px;font-weight:900;letter-spacing:-0.02em}
.hpctab .hsub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:800;margin-top:4px}
.hpctab .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hpctab .chip{font-size:10px;font-weight:700;color:rgba(255,255,255,0.82);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:4px 9px}
/* Fix Your Formm 4-step intro */
.stepline{display:flex;align-items:center;gap:13px;padding:15px 4px;border-bottom:1px solid var(--line)}
.stepnum{width:34px;height:34px;border-radius:50%;background:#DCF3E8;color:var(--green-ink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stepnum.live{background:var(--green);color:#fff}
.stept{font-size:15px;font-weight:800}
.stepd{font-size:12px;color:var(--ink2);margin-top:2px}

/* ===== High Performance entry card (dark) ===== */
.hpcard{position:relative;background:linear-gradient(150deg,#1E2219 0%,#0f120d 100%);border:1px solid rgba(18,199,174,0.22);border-radius:20px;padding:18px 18px;margin-top:14px;cursor:pointer;overflow:hidden;color:#fff}
.hpcard .pulse{position:absolute;left:-30px;bottom:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(18,199,174,0.18),transparent 70%)}
.hpcard .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--teal)}
.hpcard .ttl{font-size:21px;font-weight:800;letter-spacing:-0.02em;margin-top:4px}
.hpcard .sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:5px;line-height:1.4}
.hpcard .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hpcard .chip{font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.82);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 11px}
.hpcard .arr{position:absolute;right:16px;top:18px;color:var(--teal)}

.sec-eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
/* Mind Body Soul tiles */
.mbsgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.mbst{position:relative;border-radius:16px;padding:14px 12px 13px;cursor:pointer;overflow:hidden;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.mbst .mi{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center}
.mbst .mname{font-size:14px;font-weight:800}
.mbst .mmeta{font-size:9.5px;font-weight:600;color:rgba(255,255,255,0.82);margin-top:2px}
.mbst.mind{background:linear-gradient(155deg,#6C5CE7,#4B3FB0)}
.mbst.body{background:linear-gradient(155deg,#17A66E,#0E8A5A)}
.mbst.soul{background:linear-gradient(155deg,#E8912B,#C9741A)}
.mbsbig{border-radius:16px;padding:16px;margin-bottom:12px;color:#fff}
.mbsbig .bt{font-size:17px;font-weight:800}
.mbsbig .bp{font-size:12.5px;color:rgba(255,255,255,0.82);margin-top:5px;line-height:1.45}
.mbsbig .brow{display:flex;align-items:center;justify-content:space-between;margin-top:13px;background:rgba(255,255,255,0.14);border-radius:12px;padding:11px 13px;cursor:pointer}
.mbsbig .bq{font-size:12.5px;font-weight:700}
.mbsbig .bxp{font-size:10px;font-weight:800;background:rgba(255,255,255,0.9);color:#141310;border-radius:20px;padding:4px 9px}
.minirow{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin-bottom:10px;cursor:pointer}
.minirow .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.minirow .mn{font-size:15px;font-weight:800;letter-spacing:-0.01em}
.minirow .md{font-size:11.5px;color:var(--ink2);margin-top:2px}
.chev{color:var(--ink3);flex-shrink:0}

/* recent / history rows */
.recrow{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.recthumb{width:44px;height:44px;border-radius:11px;background:#DCF3E8;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--green-ink);font-weight:800;font-size:12px}
.recscore{font-size:22px;font-weight:800}

/* movement read */
.read{border-radius:18px;overflow:hidden;position:relative;min-height:130px;margin-top:8px;cursor:pointer;background:linear-gradient(160deg,#0E3B30,#07251e)}
.read .txt{position:relative;padding:18px 16px;color:#fff}
.read .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:800}
.read .big{font-size:16px;font-weight:700;margin-top:7px;line-height:1.3}

/* ===== nav header (reusable) ===== */
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex-shrink:0}
.nav.lt{color:#fff}
.icb{width:42px;height:42px;border-radius:13px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icb.lt{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:#fff}
.navttl{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.count{font-size:12px;font-weight:700;color:var(--green-ink);background:#DCF3E8;border-radius:20px;padding:3px 10px}
.search{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:15px;margin:4px 0 12px}
.excard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.excard .en{font-size:17px;font-weight:800;letter-spacing:-0.01em}
.excard .ed{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.35}
.camtag{font-size:12px;font-weight:600;color:var(--ink2);background:var(--sand);border-radius:10px;padding:8px 13px;white-space:nowrap;flex-shrink:0}

/* dark detail cards */
.dcard{background:#1E2219;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:18px;margin-bottom:13px;color:#fff}
.dcard h3{font-size:16px;font-weight:800}
.dcard p{font-size:13px;color:rgba(255,255,255,0.68);margin-top:7px;line-height:1.5}
.dlabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:800}
.gauge{height:9px;border-radius:9px;background:rgba(255,255,255,0.1);margin-top:14px;position:relative;overflow:hidden}
.gauge .fill{position:absolute;top:0;bottom:0;border-radius:9px}
.gscale{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.45);margin-top:7px;font-weight:600}
.bignum{font-size:40px;font-weight:900;letter-spacing:-0.03em}
.pill-dev{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;color:#0f120d;background:var(--teal);border-radius:20px;padding:4px 11px}
.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mcard{background:#1E2219;border:1px solid rgba(255,255,255,0.08);border-radius:15px;padding:15px;color:#fff}
.mcard .mv{font-size:18px;font-weight:800;letter-spacing:-0.01em;margin-top:6px}
.mcard .ml{font-size:12.5px;color:rgba(255,255,255,0.88);font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
/* tabs */
.tabwrap{background:#1E2219;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:6px;margin-bottom:13px}
.tabbar{display:flex;gap:4px;background:rgba(0,0,0,0.28);border-radius:11px;padding:4px}
.tabbtn{flex:1;border:none;background:transparent;color:rgba(255,255,255,0.6);font-family:inherit;font-weight:700;font-size:11px;padding:9px 4px;border-radius:8px;cursor:pointer}
.tabbtn.on{background:var(--teal);color:#07140f}
.tabpanel{padding:14px 12px 10px;font-size:13px;color:rgba(255,255,255,0.72);line-height:1.5}
/* social/substack link */
.sociallink{display:flex;align-items:center;gap:12px;background:#1E2219;border:1px solid rgba(18,199,174,0.3);border-radius:16px;padding:13px 14px;cursor:pointer;margin-bottom:13px}
.sociallink .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#12C7AE,#0E8A5A);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#07140f;flex-shrink:0}
/* benchmark bands */
.band{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:9px;margin-bottom:4px;background:rgba(255,255,255,0.04)}
.band.cur{background:rgba(18,199,174,0.14);border:1px solid rgba(18,199,174,0.4)}
.band .sw{width:8px;height:20px;border-radius:4px;flex-shrink:0}
.band .br{font-size:11.5px;font-weight:800;color:#fff}
.band .bd{font-size:9px;color:rgba(255,255,255,0.55);font-weight:600;margin-top:1px}
.band .tagnow{margin-left:auto;font-size:8.5px;font-weight:800;color:#07140f;background:var(--teal);border-radius:20px;padding:2px 7px;flex-shrink:0}
/* ghost body map */
.bodywrap{position:relative;display:flex;justify-content:center;padding:6px 0 2px}
.bodylegend{display:flex;justify-content:center;gap:16px;margin-top:8px}
.bodylegend span{font-size:10px;font-weight:700;color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:5px}
.bodylegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.chiprow .chip{font-size:10.5px;font-weight:700;color:rgba(255,255,255,0.82);background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 10px}
.mcard .mt{font-size:10px;font-weight:700;margin-top:6px}
.adv{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px}
.adv .at{font-size:14.5px;font-weight:800}
.adv .ap{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
.adv .flag{display:inline-block;font-size:10px;font-weight:800;color:#b23b37;background:#FBE4E3;border-radius:20px;padding:3px 9px;margin-bottom:8px}
.disc{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:4px;padding:12px;background:var(--sand);border-radius:12px}
.wkcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer}
.wkcard .wt{font-size:16px;font-weight:800}
.wkcard .wm{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.4}
.wkcard .wtags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.wtag{font-size:10.5px;font-weight:700;color:var(--green-ink);background:#DCF3E8;border-radius:20px;padding:4px 10px}
.btn{background:var(--green);color:#fff;font-weight:800;font-size:16px;text-align:center;padding:17px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;box-shadow:0 10px 24px -10px rgba(23,166,110,0.5)}

.foot{display:flex;align-items:flex-end;background:rgba(255,255,255,0.97);border-top:1px solid var(--line);flex-shrink:0;padding:0 4px}
.foot .t{flex:1;text-align:center;padding:8px 0 11px;font-size:10px;color:var(--ink3);font-weight:600;cursor:pointer}
.foot .t.on{color:var(--green-ink)}
.foot .fi{display:block;margin:0 auto 3px}
.foot .live-c{width:52px;height:52px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:-14px auto 1px;box-shadow:0 8px 18px -5px rgba(23,166,110,0.5)}
.i{stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none}
</style></head>
<body>
<div class="hd"><h1>Formm — <span>Home, built around Fix Your Formm</span></h1>
<p>Fix Your Formm is the hero. High Performance is the depth beneath it (ACWR · Injury Advice · Metrics · Movement Age). Every tile opens, every page has a back button.</p>
<div class="tag">CONCEPT — clickable</div></div>

<div class="device"><div class="vp" id="vp"></div></div>

<script>
const LOGO='<svg viewBox="0 0 100 100" style="width:100%;height:100%"><circle cx="50" cy="50" r="50" fill="#0b0b0b"/><circle cx="50" cy="50" r="41" fill="none" stroke="#12C7AE" stroke-width="3.4"/><rect x="38.5" y="24" width="6.2" height="42" rx="3.1" fill="#fff"/><circle cx="51.5" cy="27" r="3.1" fill="#12C7AE"/><circle cx="60" cy="27" r="3.1" fill="#12C7AE"/><circle cx="68.5" cy="27" r="3.1" fill="#12C7AE"/><path d="M38.5 55 q0 8 8 8" fill="none" stroke="#12C7AE" stroke-width="5.5" stroke-linecap="round"/><circle cx="53" cy="49" r="3" fill="#fff"/><path d="M60 42 l7 7 -7 7" fill="none" stroke="#12C7AE" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const SCR={};let CUR=null,hist=[];
function go(id,push=true){const el=document.getElementById(id);if(!el){T('Coming soon');return;}document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));if(push&&CUR)hist.push(CUR);CUR=id;el.classList.add('active');const s=el.querySelector('.scroll');if(s)s.scrollTop=0;}
function back(){const p=hist.pop();if(p){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('active'));CUR=p;document.getElementById(p).classList.add('active');}else go('home',false);}
function T(m){let t=document.createElement('div');t.textContent=m;t.style.cssText='position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,19,16,0.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99;font-weight:600';document.getElementById('vp').appendChild(t);setTimeout(()=>t.remove(),1400);}
const sbar='<div class="sbar"><span>9:41</span><span>&#9677; &#9626; &#9646;</span></div>';
const sbarLt='<div class="sbar lt"><span>9:41</span><span>&#9677; &#9626; &#9646;</span></div>';
const FIRE='<svg width="15" height="15" viewBox="0 0 24 24"><path d="M13 2c.5 3.5-1.5 5-2.5 6.5C9.3 10.2 9 11.4 9 12.5c-1-.5-1.8-1.8-2-3-1.5 1.3-3 3.5-3 6.2A8 8 0 0020 16c0-4.5-3-7-4.5-9C14 5.3 13.3 3.7 13 2z" fill="#E8912B"/></svg>';
const DROP='<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 2.5C12 2.5 5 10 5 15a7 7 0 0014 0c0-5-7-12.5-7-12.5z" fill="#3E8ED6"/></svg>';
const CHEV='<svg class="i chev" width="20" height="20" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

function hdr(title,dark){const cls=dark?'lt':'';return `<div class="nav ${cls}">
  <div class="icb ${cls}" onclick="back()"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="navttl">${title}</div>
  <div class="icb ${cls}" onclick="go('home',false)"><svg class="i" width="19" height="19" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>
</div>`;}

function foot(active){
 const ic={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',prog:'<path d="M4 20V10M10 20V4M16 20v-7M20 20H3"/>',prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4 12H2M22 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'};
 return `<div class="foot">

/* ================= mock chart helpers ================= */
function lineC(data,o){o=o||{};const color=o.color||'#12C7AE',fill=o.fill||'rgba(18,199,174,0.16)',labels=o.labels||[];
 const w=320,h=o.h||108,pad=8;const max=Math.max.apply(0,data),min=Math.min.apply(0,data),rng=(max-min)||1;
 const X=i=>pad+i/(data.length-1)*(w-2*pad);const Y=v=>h-14-((v-min)/rng)*(h-26);
 const ln=data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
 const ar=pad+','+(h-14)+' '+ln+' '+(w-pad)+','+(h-14);
 const dots=data.map((v,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.2" fill="'+color+'"/>').join('');
 const grid=[0.25,0.5,0.75].map(g=>'<line x1="'+pad+'" x2="'+(w-pad)+'" y1="'+(14+g*(h-28)).toFixed(1)+'" y2="'+(14+g*(h-28)).toFixed(1)+'" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>').join('');
 const lab=labels.length?'<div style="display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,0.4);margin-top:5px;font-weight:600">'+labels.map(l=>'<span>'+l+'</span>').join('')+'</div>':'';
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;margin-top:10px">'+grid+'<polygon points="'+ar+'" fill="'+fill+'"/><polyline points="'+ln+'" fill="none" stroke="'+color+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>'+lab;}
function colC(data,color,labels){const max=Math.max.apply(0,data);
 return '<div style="display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:12px">'+data.map(v=>'<div style="flex:1;height:100%;display:flex;align-items:flex-end"><div style="width:100%;height:'+Math.max(6,v/max*100).toFixed(0)+'%;background:'+color+';border-radius:6px 6px 0 0"></div></div>').join('')+'</div><div style="display:flex;gap:8px;margin-top:6px">'+labels.map(l=>'<span style="flex:1;text-align:center;font-size:9px;color:rgba(255,255,255,0.42);font-weight:600">'+l+'</span>').join('')+'</div>';}
function barsH(items){return '<div style="margin-top:12px">'+items.map(it=>{const l=it[0],p=it[1],val=it[2],c=it[3];return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px"><span style="color:rgba(255,255,255,0.85)">'+l+'</span><span style="color:'+c+'">'+val+'</span></div><div style="height:8px;border-radius:8px;background:rgba(255,255,255,0.1);overflow:hidden"><div style="height:100%;width:'+p+'%;background:'+c+';border-radius:8px"></div></div></div>';}).join('')+'</div>';}

function tabSel(grp,idx){
 document.querySelectorAll('[data-tabs="'+grp+'"] .tabbtn').forEach((b,i)=>b.classList.toggle('on',i===idx));
 document.querySelectorAll('[data-tabs="'+grp+'"] .tabpanel').forEach((p,i)=>{p.style.display=i===idx?'block':'none';});
}

   <div class="tabpanel" style="display:none">Spiking load faster than your body has adapted to is one of the most consistent predictors of injury in the research. Keeping ACWR in the sweet spot is how athletes build fitness while staying healthy — and now you can too.</div>
 </div>
